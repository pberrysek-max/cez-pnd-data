name: CEZ PND
version: "0.4.1"
slug: cez-pnd
description: "CEZ PND data integration for Home Assistant via MQTT Discovery"
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
services:
  - "mqtt:need"
options:
  email: ""
  password: ""
  electrometer_id: ""
  ean: ""
  electrometers: "[]"
  mqtt_user: ""
  mqtt_password: ""
schema:
  email: str
  password: password
  electrometer_id: str?
  ean: str?
  electrometers: str?
  mqtt_user: str?
  mqtt_password: password?
map:
  - "share:rw"
